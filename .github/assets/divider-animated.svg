<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 12" width="1200" height="12">
  <defs>
    <linearGradient id="divGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7b2ff7" stop-opacity="0">
        <animate attributeName="stop-color" values="#7b2ff7;#00d2ff;#64ffda;#ff6b6b;#ffd93d;#7b2ff7" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="20%" stop-color="#7b2ff7">
        <animate attributeName="stop-color" values="#7b2ff7;#00d2ff;#64ffda;#ff6b6b;#ffd93d;#7b2ff7" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#00d2ff">
        <animate attributeName="stop-color" values="#00d2ff;#64ffda;#ff6b6b;#ffd93d;#7b2ff7;#00d2ff" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="80%" stop-color="#64ffda">
        <animate attributeName="stop-color" values="#64ffda;#ff6b6b;#ffd93d;#7b2ff7;#00d2ff;#64ffda" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#64ffda" stop-opacity="0">
        <animate attributeName="stop-color" values="#64ffda;#ff6b6b;#ffd93d;#7b2ff7;#00d2ff;#64ffda" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <filter id="dGlow"><feGaussianBlur stdDeviation="2" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <line x1="50" y1="6" x2="1150" y2="6" stroke="url(#divGrad)" stroke-width="2" stroke-linecap="round" filter="url(#dGlow)"/>
  <!-- Center diamond -->
  <rect x="596" y="2" width="8" height="8" rx="1.5" fill="#00d2ff" transform="rotate(45 600 6)" filter="url(#dGlow)">
    <animate attributeName="fill" values="#00d2ff;#7b2ff7;#ff6b6b;#ffd93d;#64ffda;#00d2ff" dur="6s" repeatCount="indefinite"/>
  </rect>
</svg>
