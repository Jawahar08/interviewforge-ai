<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 200" width="1200" height="200">
  <defs>
    <linearGradient id="tsGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7b2ff7"><animate attributeName="stop-color" values="#7b2ff7;#00d2ff;#7b2ff7" dur="6s" repeatCount="indefinite"/></stop>
      <stop offset="50%" stop-color="#00d2ff"><animate attributeName="stop-color" values="#00d2ff;#64ffda;#00d2ff" dur="6s" repeatCount="indefinite"/></stop>
      <stop offset="100%" stop-color="#64ffda"><animate attributeName="stop-color" values="#64ffda;#7b2ff7;#64ffda" dur="6s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <filter id="techGlow"><feGaussianBlur stdDeviation="2" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="techGlowStrong"><feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>

    <!-- Orbit path -->
    <path id="orbit1" d="M 600,100 m -450,0 a 450,50 0 1,0 900,0 a 450,50 0 1,0 -900,0" fill="none"/>
    <path id="orbit2" d="M 600,100 m -350,0 a 350,35 0 1,0 700,0 a 350,35 0 1,0 -700,0" fill="none"/>
  </defs>

  <rect width="1200" height="200" fill="#030712" rx="12"/>

  <!-- Orbital rings -->
  <ellipse cx="600" cy="100" rx="450" ry="50" fill="none" stroke="#1e293b" stroke-width="0.8" stroke-dasharray="4 8" opacity="0.4">
    <animate attributeName="stroke-dashoffset" values="0;-24" dur="3s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="600" cy="100" rx="350" ry="35" fill="none" stroke="#1e293b" stroke-width="0.8" stroke-dasharray="4 8" opacity="0.3">
    <animate attributeName="stroke-dashoffset" values="0;24" dur="4s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Center "hub" -->
  <circle cx="600" cy="100" r="30" fill="#0a0f1e" stroke="url(#tsGrad)" stroke-width="2" filter="url(#techGlow)">
    <animate attributeName="r" values="28;32;28" dur="3s" repeatCount="indefinite"/>
  </circle>
  <text x="600" y="96" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" fill="#e2e8f0" font-weight="800">TECH</text>
  <text x="600" y="110" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" fill="#e2e8f0" font-weight="800">STACK</text>

  <!-- Orbiting tech nodes - outer ring -->
  <!-- Next.js -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 600 100" to="360 600 100" dur="30s" repeatCount="indefinite"/>
    <g transform="translate(600, 50)">
      <circle r="22" fill="#0a0f1e" stroke="#000" stroke-width="1.5"/>
      <text y="4" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="8" fill="#fff" font-weight="bold">Next.js</text>
    </g>
  </g>
  <!-- Spring Boot -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="51 600 100" to="411 600 100" dur="30s" repeatCount="indefinite"/>
    <g transform="translate(600, 50)">
      <circle r="22" fill="#0a0f1e" stroke="#6db33f" stroke-width="1.5"/>
      <text y="4" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="7" fill="#6db33f" font-weight="bold">Spring</text>
    </g>
  </g>
  <!-- PostgreSQL -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="102 600 100" to="462 600 100" dur="30s" repeatCount="indefinite"/>
    <g transform="translate(600, 50)">
      <circle r="22" fill="#0a0f1e" stroke="#4169E1" stroke-width="1.5"/>
      <text y="4" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="6" fill="#4169E1" font-weight="bold">Postgres</text>
    </g>
  </g>
  <!-- Gemini -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="154 600 100" to="514 600 100" dur="30s" repeatCount="indefinite"/>
    <g transform="translate(600, 50)">
      <circle r="22" fill="#0a0f1e" stroke="#4285F4" stroke-width="1.5"/>
      <text y="4" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="7" fill="#4285F4" font-weight="bold">Gemini</text>
    </g>
  </g>
  <!-- React -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="205 600 100" to="565 600 100" dur="30s" repeatCount="indefinite"/>
    <g transform="translate(600, 50)">
      <circle r="22" fill="#0a0f1e" stroke="#61DAFB" stroke-width="1.5"/>
      <text y="4" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="8" fill="#61DAFB" font-weight="bold">React</text>
    </g>
  </g>
  <!-- TypeScript -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="257 600 100" to="617 600 100" dur="30s" repeatCount="indefinite"/>
    <g transform="translate(600, 50)">
      <circle r="22" fill="#0a0f1e" stroke="#3178C6" stroke-width="1.5"/>
      <text y="4" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9" fill="#3178C6" font-weight="bold">TS</text>
    </g>
  </g>
  <!-- Java -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="308 600 100" to="668 600 100" dur="30s" repeatCount="indefinite"/>
    <g transform="translate(600, 50)">
      <circle r="22" fill="#0a0f1e" stroke="#ED8B00" stroke-width="1.5"/>
      <text y="4" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="7" fill="#ED8B00" font-weight="bold">Java 23</text>
    </g>
  </g>

  <!-- Inner ring nodes -->
  <!-- Docker -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 600 100" to="-360 600 100" dur="25s" repeatCount="indefinite"/>
    <g transform="translate(600, 65)">
      <circle r="16" fill="#0a0f1e" stroke="#2496ED" stroke-width="1"/>
      <text y="4" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="6" fill="#2496ED" font-weight="bold">Docker</text>
    </g>
  </g>
  <!-- Tailwind -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="72 600 100" to="-288 600 100" dur="25s" repeatCount="indefinite"/>
    <g transform="translate(600, 65)">
      <circle r="16" fill="#0a0f1e" stroke="#06B6D4" stroke-width="1"/>
      <text y="4" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="5.5" fill="#06B6D4" font-weight="bold">Tailwind</text>
    </g>
  </g>
  <!-- Zustand -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="144 600 100" to="-216 600 100" dur="25s" repeatCount="indefinite"/>
    <g transform="translate(600, 65)">
      <circle r="16" fill="#0a0f1e" stroke="#F59E0B" stroke-width="1"/>
      <text y="4" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="5.5" fill="#F59E0B" font-weight="bold">Zustand</text>
    </g>
  </g>
  <!-- JWT -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="216 600 100" to="-144 600 100" dur="25s" repeatCount="indefinite"/>
    <g transform="translate(600, 65)">
      <circle r="16" fill="#0a0f1e" stroke="#D63AFF" stroke-width="1"/>
      <text y="4" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="7" fill="#D63AFF" font-weight="bold">JWT</text>
    </g>
  </g>
  <!-- Flyway -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="288 600 100" to="-72 600 100" dur="25s" repeatCount="indefinite"/>
    <g transform="translate(600, 65)">
      <circle r="16" fill="#0a0f1e" stroke="#CC0200" stroke-width="1"/>
      <text y="4" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="5.5" fill="#CC0200" font-weight="bold">Flyway</text>
    </g>
  </g>

  <!-- Border -->
  <rect x="1" y="1" width="1198" height="198" fill="none" rx="12" stroke="url(#tsGrad)" stroke-width="1" opacity="0.2"/>
</svg>
