<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 180" width="1200" height="180">
  <defs>
    <linearGradient id="tsGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7b2ff7"><animate attributeName="stop-color" values="#7b2ff7;#00d2ff;#64ffda;#7b2ff7" dur="6s" repeatCount="indefinite"/></stop>
      <stop offset="50%" stop-color="#00d2ff"><animate attributeName="stop-color" values="#00d2ff;#64ffda;#ff6b6b;#00d2ff" dur="6s" repeatCount="indefinite"/></stop>
      <stop offset="100%" stop-color="#64ffda"><animate attributeName="stop-color" values="#64ffda;#7b2ff7;#64ffda" dur="6s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <filter id="tsGlow"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <!-- Deep dark container -->
  <rect width="1200" height="180" fill="#030712" rx="14"/>
  <rect x="1" y="1" width="1198" height="178" fill="none" rx="14" stroke="url(#tsGrad)" stroke-width="1.2" opacity="0.35"/>

  <!-- Row 1: Core Technologies (5 Columns) -->
  <g transform="translate(16, 16)">
    <!-- 1. Next.js 16 -->
    <g transform="translate(0, 0)">
      <rect width="224" height="66" rx="10" fill="#0a0f1e" stroke="#ffffff" stroke-width="1" opacity="0.9"/>
      <circle cx="28" cy="33" r="14" fill="#000" stroke="#fff" stroke-width="1"/>
      <text x="28" y="38" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="12" fill="#fff" font-weight="900">N</text>
      <text x="52" y="28" font-family="'Segoe UI', sans-serif" font-size="13" fill="#ffffff" font-weight="800">Next.js 16</text>
      <text x="52" y="46" font-family="'Segoe UI', sans-serif" font-size="9.5" fill="#64748b">App Router · Turbopack</text>
    </g>

    <!-- 2. Java 23 -->
    <g transform="translate(236, 0)">
      <rect width="224" height="66" rx="10" fill="#0a0f1e" stroke="#ED8B00" stroke-width="1" opacity="0.9"/>
      <circle cx="28" cy="33" r="14" fill="#1e150a" stroke="#ED8B00" stroke-width="1"/>
      <text x="28" y="38" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" fill="#ED8B00" font-weight="900">☕</text>
      <text x="52" y="28" font-family="'Segoe UI', sans-serif" font-size="13" fill="#ED8B00" font-weight="800">Java 23</text>
      <text x="52" y="46" font-family="'Segoe UI', sans-serif" font-size="9.5" fill="#64748b">Modern OpenJDK Runtime</text>
    </g>

    <!-- 3. Spring Boot 3 -->
    <g transform="translate(472, 0)">
      <rect width="224" height="66" rx="10" fill="#0a0f1e" stroke="#6db33f" stroke-width="1" opacity="0.9"/>
      <circle cx="28" cy="33" r="14" fill="#0d1f0d" stroke="#6db33f" stroke-width="1"/>
      <text x="28" y="38" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" fill="#6db33f" font-weight="900">🌱</text>
      <text x="52" y="28" font-family="'Segoe UI', sans-serif" font-size="13" fill="#6db33f" font-weight="800">Spring Boot 3</text>
      <text x="52" y="46" font-family="'Segoe UI', sans-serif" font-size="9.5" fill="#64748b">REST API Framework</text>
    </g>

    <!-- 4. PostgreSQL 15 -->
    <g transform="translate(708, 0)">
      <rect width="224" height="66" rx="10" fill="#0a0f1e" stroke="#4169E1" stroke-width="1" opacity="0.9"/>
      <circle cx="28" cy="33" r="14" fill="#0d1428" stroke="#4169E1" stroke-width="1"/>
      <text x="28" y="38" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" fill="#4169E1" font-weight="900">🐘</text>
      <text x="52" y="28" font-family="'Segoe UI', sans-serif" font-size="13" fill="#4169E1" font-weight="800">PostgreSQL 15</text>
      <text x="52" y="46" font-family="'Segoe UI', sans-serif" font-size="9.5" fill="#64748b">Relational Database</text>
    </g>

    <!-- 5. Gemini 2.5 Flash -->
    <g transform="translate(944, 0)">
      <rect width="224" height="66" rx="10" fill="#0a0f1e" stroke="#4285F4" stroke-width="1" opacity="0.9"/>
      <circle cx="28" cy="33" r="14" fill="#0c182b" stroke="#4285F4" stroke-width="1"/>
      <text x="28" y="38" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" fill="#4285F4" font-weight="900">✨</text>
      <text x="52" y="28" font-family="'Segoe UI', sans-serif" font-size="13" fill="#4285F4" font-weight="800">Gemini 2.5 AI</text>
      <text x="52" y="46" font-family="'Segoe UI', sans-serif" font-size="9.5" fill="#64748b">Google AI Engine</text>
    </g>
  </g>

  <!-- Row 2: Secondary Libraries & Stack (5 Columns) -->
  <g transform="translate(16, 96)">
    <!-- 6. React 19 -->
    <g transform="translate(0, 0)">
      <rect width="224" height="66" rx="10" fill="#0a0f1e" stroke="#61DAFB" stroke-width="1" opacity="0.9"/>
      <circle cx="28" cy="33" r="14" fill="#0a1d24" stroke="#61DAFB" stroke-width="1"/>
      <text x="28" y="38" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" fill="#61DAFB" font-weight="900">⚛️</text>
      <text x="52" y="28" font-family="'Segoe UI', sans-serif" font-size="13" fill="#61DAFB" font-weight="800">React 19</text>
      <text x="52" y="46" font-family="'Segoe UI', sans-serif" font-size="9.5" fill="#64748b">UI Component Engine</text>
    </g>

    <!-- 7. TypeScript 5 -->
    <g transform="translate(236, 0)">
      <rect width="224" height="66" rx="10" fill="#0a0f1e" stroke="#3178C6" stroke-width="1" opacity="0.9"/>
      <circle cx="28" cy="33" r="14" fill="#0a1828" stroke="#3178C6" stroke-width="1"/>
      <text x="28" y="38" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" fill="#3178C6" font-weight="900">TS</text>
      <text x="52" y="28" font-family="'Segoe UI', sans-serif" font-size="13" fill="#3178C6" font-weight="800">TypeScript 5</text>
      <text x="52" y="46" font-family="'Segoe UI', sans-serif" font-size="9.5" fill="#64748b">Type-Safe Codebase</text>
    </g>

    <!-- 8. Tailwind CSS -->
    <g transform="translate(472, 0)">
      <rect width="224" height="66" rx="10" fill="#0a0f1e" stroke="#06B6D4" stroke-width="1" opacity="0.9"/>
      <circle cx="28" cy="33" r="14" fill="#071c21" stroke="#06B6D4" stroke-width="1"/>
      <text x="28" y="38" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" fill="#06B6D4" font-weight="900">🎨</text>
      <text x="52" y="28" font-family="'Segoe UI', sans-serif" font-size="13" fill="#06B6D4" font-weight="800">Tailwind CSS</text>
      <text x="52" y="46" font-family="'Segoe UI', sans-serif" font-size="9.5" fill="#64748b">Utility-First Styling</text>
    </g>

    <!-- 9. Docker Container -->
    <g transform="translate(708, 0)">
      <rect width="224" height="66" rx="10" fill="#0a0f1e" stroke="#2496ED" stroke-width="1" opacity="0.9"/>
      <circle cx="28" cy="33" r="14" fill="#091b29" stroke="#2496ED" stroke-width="1"/>
      <text x="28" y="38" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" fill="#2496ED" font-weight="900">🐳</text>
      <text x="52" y="28" font-family="'Segoe UI', sans-serif" font-size="13" fill="#2496ED" font-weight="800">Docker</text>
      <text x="52" y="46" font-family="'Segoe UI', sans-serif" font-size="9.5" fill="#64748b">Container Deployment</text>
    </g>

    <!-- 10. Spring Security & JWT -->
    <g transform="translate(944, 0)">
      <rect width="224" height="66" rx="10" fill="#0a0f1e" stroke="#7b2ff7" stroke-width="1" opacity="0.9"/>
      <circle cx="28" cy="33" r="14" fill="#170c29" stroke="#7b2ff7" stroke-width="1"/>
      <text x="28" y="38" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" fill="#7b2ff7" font-weight="900">🔒</text>
      <text x="52" y="28" font-family="'Segoe UI', sans-serif" font-size="13" fill="#a78bfa" font-weight="800">Spring Security</text>
      <text x="52" y="46" font-family="'Segoe UI', sans-serif" font-size="9.5" fill="#64748b">JWT Stateless Auth</text>
    </g>
  </g>
</svg>
