<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 130" width="1200" height="130">
  <defs>
    <linearGradient id="ftGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7b2ff7">
        <animate attributeName="stop-color" values="#7b2ff7;#00d2ff;#64ffda;#7b2ff7" dur="5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#00d2ff">
        <animate attributeName="stop-color" values="#00d2ff;#ff6b6b;#7b2ff7;#00d2ff" dur="5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#64ffda">
        <animate attributeName="stop-color" values="#64ffda;#ffd93d;#00d2ff;#64ffda" dur="5s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <filter id="fGlow"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="fGlowStrong"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <rect width="1200" height="130" fill="#030712" rx="16"/>

  <!-- Aurora background -->
  <ellipse cx="400" cy="65" rx="300" ry="80" fill="#7b2ff7" opacity="0.04">
    <animate attributeName="cx" values="400;800;400" dur="10s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Top gradient line -->
  <line x1="50" y1="8" x2="1150" y2="8" stroke="url(#ftGrad)" stroke-width="2" stroke-linecap="round" opacity="0.4"/>

  <!-- Main tagline -->
  <text x="600" y="55" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="22" fill="url(#ftGrad)" filter="url(#fGlow)" font-weight="800" letter-spacing="1">
    Practice · Analyze · Improve · Get Hired
  </text>

  <!-- Sub text -->
  <text x="600" y="80" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" fill="#475569" font-weight="600">
    Powered by Google Gemini 2.5 Flash · Built with Next.js 16 + Spring Boot 3 · 100% Free &amp; Open Source
  </text>

  <!-- Heart + GitHub -->
  <text x="600" y="108" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" fill="#64748b">
    Made with
  </text>
  <text x="660" y="108" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="14" fill="#ff6b6b">
    ❤️
    <animate attributeName="font-size" values="14;17;14" dur="1s" repeatCount="indefinite"/>
  </text>
  <text x="712" y="108" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" fill="#64748b">
    by Jawahar
  </text>

  <!-- Bottom gradient line -->
  <line x1="100" y1="122" x2="1100" y2="122" stroke="url(#ftGrad)" stroke-width="1.5" stroke-linecap="round" opacity="0.3"/>

  <!-- Animated border -->
  <rect x="1" y="1" width="1198" height="128" fill="none" rx="16" stroke="url(#ftGrad)" stroke-width="1" opacity="0.2"/>
</svg>
